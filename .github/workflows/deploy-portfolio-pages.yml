name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "portfolio-pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare minimal site folder
        run: |
          set -e
          rm -rf public_site
          mkdir -p public_site
          # Copy required application files; fail the deploy if one is missing.
          cp -v index.html public_site/
          cp -v style.css public_site/
          cp -v home-redesign.css public_site/
          cp -v case-redesign.css public_site/
          cp -v script.js public_site/
          # copy site folders: case studies, both resumes, images
          for d in work resume operation-resume assets images static img; do
            if [ -d "$d" ]; then cp -r "$d" public_site/; fi
          done
          # remove any sensitive files accidentally copied
          rm -f public_site/.env public_site/*.key || true
          echo "Prepared public_site contents:" && ls -la public_site

      - name: Upload artifact (portfolio)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
